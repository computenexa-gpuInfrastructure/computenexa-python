[project]
name = "computenexa"
version = "0.1.0"
description = "Python client for ComputeNexa: private GPUs for your business, launched and stopped from code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ComputeNexa", email = "support@computenexa.com" }]
maintainers = [{ name = "ComputeNexa", email = "support@computenexa.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]
keywords = ["gpu", "cloud", "ai", "private ai", "computenexa", "llm", "inference", "training"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://computenexa.com"
Documentation = "https://app.computenexa.com/help/api"
"API reference" = "https://app.computenexa.com/help/api/reference"
Support = "mailto:support@computenexa.com"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computenexa"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: talks to a real ComputeNexa API (set CNX_TEST_API_URL and CNX_TEST_API_KEY)"]

[tool.ruff]
line-length = 120
target-version = "py39"
